<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orsini Seguros — Cotizá y pagá menos</title>
  <link rel="icon" type="image/png" href="assets/orsini-seguros-icon.png" />
  <link rel="icon" type="image/x-icon" href="assets/orsini-seguros-icon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --bg-2: #EEF4FF;
      --ink: #2C2C2C;
      --ink-2: #4a4a4a;
      --muted: #7a7a7a;
      --line: #e0e8f4;
      --card: #ffffff;
      --brand: #1565C0;
      --brand-2: #0D47A1;
      --accent: #2896FE;
      --accent-2: #F6D365;
      --navy: #0B2347;
      --good: #1f7a4d;
      --bad: #b3261e;
      --shadow: 0 1px 2px rgba(44,44,44,.06), 0 8px 28px rgba(21,101,192,.15);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .serif { font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.01em; }
    a { color: inherit; }
    button { font-family: inherit; }
    input, select { font-family: inherit; }
    img { max-width: 100%; display: block; }
    #root { min-height: 100vh; }

    /* ============ Responsive overrides ============ */
    @media (max-width: 960px) {
      .nav-links { gap: 16px !important; }
      .nav-links a:not(.keep) { display: none !important; }
      .hero-grid { grid-template-columns: 1fr !important; gap: 32px !important; padding-top: 24px !important; }
      .hero-form-card { position: static !important; padding: 20px !important; }
      .ramo-tiles { display: grid !important; grid-template-columns: repeat(5, 1fr) !important; gap: 8px !important; max-width: 100% !important; }
      .ramo-tiles > button { width: 100% !important; flex: none !important; }
      .aseg-row { grid-template-columns: 1fr !important; gap: 24px !important; }
      .aseg-grid { grid-template-columns: repeat(3, 1fr) !important; }
      .three-col { grid-template-columns: 1fr !important; gap: 14px !important; }
      .two-col { grid-template-columns: 1fr !important; gap: 24px !important; }
      .calc-grid { grid-template-columns: 1fr !important; gap: 32px !important; }
      .footer-grid { grid-template-columns: 1fr !important; gap: 32px !important; padding-bottom: 32px !important; }
      .testi-grid { grid-template-columns: 1fr !important; }
      .tips-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .faq-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
    }
    @media (max-width: 640px) {
      h1.hero-title { font-size: 38px !important; }
      .ramo-switch { padding: 4px !important; gap: 4px !important; }
      .ramo-switch::-webkit-scrollbar { display: none; }
      .ramo-switch button { height: 34px !important; padding: 0 12px !important; font-size: 12px !important; }
      .ramo-label-full { display: none !important; }
      .ramo-label-short { display: inline !important; }
      .ramo-tiles { display: grid !important; grid-template-columns: repeat(5, 1fr) !important; gap: 5px !important; }
      .ramo-tiles > button { width: 100% !important; flex: none !important; }
      .hero-trust { flex-direction: column !important; gap: 8px !important; align-items: flex-start !important; }
      .aseg-grid { grid-template-columns: 1fr !important; }
      .form-grid { grid-template-columns: 1fr !important; }
      .form-grid > * { grid-column: 1 / -1 !important; }
      .form-contact-grid { grid-template-columns: 1fr !important; }
      .form-contact-grid > * { grid-column: 1 / -1 !important; }
      .tips-grid { grid-template-columns: 1fr !important; }
      .submit-row { flex-direction: column !important; align-items: stretch !important; }
      .submit-row button { width: 100% !important; justify-content: center !important; }
      .calc-card { padding: 20px !important; }
      .calc-card .calc-amount { font-size: 44px !important; }
      .section-pad { padding: 56px 0 !important; }
      .container-pad { padding: 0 18px !important; }
      .hero-trust { gap: 12px !important; font-size: 12px !important; }
      .nav-cta { padding: 0 12px !important; font-size: 12px !important; }
      .viajero-trip-grid { grid-template-columns: 1fr !important; }
      .viajero-trip-grid > * { grid-column: 1 / -1 !important; }
      .viajero-card { gap: 10px !important; padding: 12px !important; }
      .viajero-card-cta { padding: 0 10px !important; font-size: 11px !important; height: 32px !important; }
      .viajero-card-tag { display: none !important; }
    }
    @media (max-width: 380px) {
      .viajero-card-text > div:first-child { font-size: 13px !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/visuals.jsx"></script>
  <script type="text/babel" src="components/forms.jsx"></script>
  <script type="text/babel" src="components/sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
